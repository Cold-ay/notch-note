name: FlowTasks
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
targets:
  FlowTasks-iOS:
    type: application
    platform: iOS
    sources: [Sources/FlowTasks]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.flowtasks
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    entitlements:
      path: Config/iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.flowtasks]
    dependencies:
      - target: FlowTasksWidget
  FlowTasksWidget:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.flowtasks.widget
    info:
      path: Config/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.flowtasks]
  FlowTasks-macOS:
    type: application
    platform: macOS
    sources: [Sources/FlowTasks]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.flowtasks.mac
